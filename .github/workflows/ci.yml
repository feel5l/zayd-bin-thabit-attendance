name: CI

# Typecheck, unit tests and production build on every PR and push to main.
# No secrets are used; the build runs without VITE_SUPABASE_* (sync becomes a
# no-op, which is the documented offline mode).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Guard against runtime CDN Tailwind (must be a build-time dependency)
        run: |
          if grep -rq "cdn.tailwindcss.com" dist/; then
            echo "::error::cdn.tailwindcss.com found in dist/ - Tailwind must be compiled at build time"; exit 1
          fi

      - name: Validate vercel.json security headers
        run: node -e "const h=JSON.parse(require('fs').readFileSync('vercel.json','utf8')).headers.flatMap(r=>r.headers.map(x=>x.key)); for (const k of ['Strict-Transport-Security','X-Content-Type-Options','X-Frame-Options','Referrer-Policy','Permissions-Policy','Content-Security-Policy']) if(!h.includes(k)){console.error('missing header '+k);process.exit(1)}"

      - name: Guard against student PII in the bundle
        run: |
          if grep -qE 'nationalId:"[0-9]{10}"|parentPhone:"05[0-9]{8}"' dist/assets/*.js; then
            echo "::error::Student national ids or guardian phones found in dist/"; exit 1
          fi
